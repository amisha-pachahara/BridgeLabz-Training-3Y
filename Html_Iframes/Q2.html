<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>
<body>

    <h2>My City Location</h2>

    <iframe
        src="https://www.google.com/maps?q=Mathura,India&output=embed"
        title="Google Map showing Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

    <!-- loading="lazy" means the iframe loads only when it is near the visible area of the page. -->

</body>
</html>
