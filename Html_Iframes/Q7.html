<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
</head>
<body>

    <h2>Login</h2>

    <form>
        <label>Username:</label>
        <input type="text" name="username" required>
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>
        <br><br>

        <!-- CSRF token helps protect the form from Cross-Site Request Forgery attacks. -->
        <input type="hidden" name="csrf_token" value="dummy123">

        <input type="submit" value="Login">
    </form>

</body>
</html>
