<!DOCTYPE html>
<html>
<head>

    <!-- title defines the title shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- meta charset defines the character encoding -->
    <meta charset="UTF-8">

    <!-- meta description provides a short description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- meta author specifies the author of the webpage -->
    <meta name="author" content="Amisha Pachahara">

    <!-- base defines the base URL for relative links -->
    <base href="https://example.com/">

    <!-- link is used to connect external resources such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- style is used to write CSS styles -->
    <style>
    </style>

    <!-- script is used to write or connect JavaScript -->
    <script>
    </script>

</head>
<body>

    <h1>Important Head Elements</h1>

    <p>
        This webpage demonstrates different elements used inside the head section.
    </p>

</body>
</html>
