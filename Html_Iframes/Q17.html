<!DOCTYPE html>
<html>
<head>
    <title>Form Page</title>
</head>
<body>

    <h2>Simple Form</h2>

    <form action="result.html" target="resultFrame">
        <label>Enter your name:</label>

        <input type="text" name="name" required>

        <input type="submit" value="Submit">
    </form>

    <br>

    <iframe
        name="resultFrame"
        width="60%"
        height="150"
        title="Result">
    </iframe>

</body>
</html>
