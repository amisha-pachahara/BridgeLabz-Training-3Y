
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img class="blur" src="https://picsum.photos/id/1015/400/300" alt="Mountain">
                <figcaption>Blur Effect</figcaption>
            </figure>

            <figure>
                <img class="grayscale" src="https://picsum.photos/id/1016/400/300" alt="Nature">
                <figcaption>Grayscale Effect</figcaption>
            </figure>

            <figure>
                <img class="sepia" src="https://picsum.photos/id/1025/400/300" alt="Dog">
                <figcaption>Sepia Effect</figcaption>
            </figure>

            <figure>
                <img class="brightness" src="https://picsum.photos/id/1035/400/300" alt="Landscape">
                <figcaption>Brightness Effect</figcaption>
            </figure>

            <figure>
                <img class="contrast" src="https://picsum.photos/id/1043/400/300" alt="Forest">
                <figcaption>Contrast Effect</figcaption>
            </figure>

            <figure>
                <img class="hue" src="https://picsum.photos/id/1050/400/300" alt="Water">
                <figcaption>Hue Rotate Effect</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>Responsive CSS Filter Gallery</p>
    </footer>

</body>
</html>
