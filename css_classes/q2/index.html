
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the elements to see the tooltips.</p>

        <section class="tooltip-container">

            <div class="tooltip-box">
                <span>Home</span>
                <span class="tooltip-text">Go to Home</span>
            </div>

            <div class="tooltip-box">
                <span>Profile</span>
                <span class="tooltip-text">View Profile</span>
            </div>

            <div class="tooltip-box">
                <span>Settings</span>
                <span class="tooltip-text">Open Settings</span>
            </div>

            <div class="tooltip-box">
                <span>Help</span>
                <span class="tooltip-text">Get Help</span>
            </div>

        </section>

    </main>

</body>
</html>
