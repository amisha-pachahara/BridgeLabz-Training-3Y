
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Hover over an image to see the effect.</p>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img src="https://picsum.photos/id/1015/500/300" alt="Mountain">
                <figcaption>Mountain View</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/id/1016/500/300" alt="Nature">
                <figcaption>Beautiful Nature</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/id/1018/500/300" alt="Forest">
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/id/1019/500/300" alt="Landscape">
                <figcaption>Natural Landscape</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/id/1020/500/300" alt="River">
                <figcaption>River View</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/id/1024/500/300" alt="Animal">
                <figcaption>Wildlife</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
