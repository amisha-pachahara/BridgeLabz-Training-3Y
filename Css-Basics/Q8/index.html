
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <h2>My Dashboard</h2>
    </header>

    <div class="layout">

        <aside class="sidebar">

            <h3>MENU</h3>

            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Messages</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>

        </aside>

        <main class="content">

            <h1>Dashboard Overview</h1>

            <div class="boxes">

                <div class="box">
                    <h2>Total Users</h2>
                    <p class="number">1,250</p>
                    <p>Registered users</p>
                </div>

                <div class="box">
                    <h2>Total Projects</h2>
                    <p class="number">85</p>
                    <p>Active projects</p>
                </div>

                <div class="box">
                    <h2>Completed Tasks</h2>
                    <p class="number">342</p>
                    <p>Tasks completed</p>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
