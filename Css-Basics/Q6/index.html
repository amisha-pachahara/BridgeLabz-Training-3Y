
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Gallery</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Beautiful moments captured in pictures</p>
    </header>

    <main class="gallery">

        <div class="photo">
            <img src="image1.jpg" alt="Mountain">
            <div class="caption">Beautiful Mountains</div>
        </div>

        <div class="photo">
            <img src="image2.jpg" alt="Beach">
            <div class="caption">Peaceful Beach</div>
        </div>

        <div class="photo">
            <img src="image3.jpg" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="photo">
            <img src="image4.jpg" alt="City">
            <div class="caption">Beautiful City</div>
        </div>

        <div class="photo">
            <img src="image5.jpg" alt="Sunset">
            <div class="caption">Amazing Sunset</div>
        </div>

        <div class="photo">
            <img src="image6.jpg" alt="Lake">
            <div class="caption">Peaceful Lake</div>
        </div>

    </main>

</body>
</html>
