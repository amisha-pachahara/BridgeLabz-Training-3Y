
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Form Builder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 30px auto;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h2>Custom Form Builder</h2>

    <div id="formContainer"></div>

    <h3>Submitted Data</h3>
    <pre id="output"></pre>

    <script src="Q4.js"></script>
</body>
</html>
