<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="personal-portfolio.css">
</head>

<body class="bg-light text-dark">

    <!-- Header -->
    <header class="text-center mt-4 mb-3">
        <h1 class="fw-bold">Amisha Pachahara</h1>
        <p class="lead">Web Developer & Technology Enthusiast</p>
    </header>

    <main>

        <!-- Profile Section -->
        <section class="container text-center p-5">

            <img
                src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400"
                alt="Profile"
                class="img-fluid rounded-circle profile-image mb-4"
            >

            <h2 class="fw-bold">Hello, I'm Amisha</h2>

            <p class="mb-4">
                I create clean, responsive and user-friendly digital
                experiences using modern web technologies.
            </p>

            <!-- Buttons -->
            <div class="mb-5">
                <button class="btn btn-primary me-2">Hire Me</button>
                <button class="btn btn-outline-dark">Download CV</button>
            </div>

            <!-- Contact Form -->
            <div class="contact-box mx-auto">
                <h3 class="fw-bold mb-3">Contact Me</h3>

                <form>
                    <input
                        type="text"
                        class="form-control mb-3"
                        placeholder="Your Name"
                    >

                    <input
                        type="email"
                        class="form-control mb-3"
                        placeholder="Your Email"
                    >

                    <textarea
                        class="form-control mb-3"
                        rows="4"
                        placeholder="Your Message"
                    ></textarea>

                    <button class="btn btn-primary">
                        Send Message
                    </button>
                </form>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 bg-dark text-white">
        <p class="mb-0">© 2026 Amisha Pachahara</p>
    </footer>

</body>
</html>
