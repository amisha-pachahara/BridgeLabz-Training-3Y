
<!DOCTYPE html>
<html>
<head>
    <title>Character Counter</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        textarea {
            width: 300px;
            height: 100px;
        }

        #counter {
            color: green;
        }

        .warning {
            color: yellow !important;
        }

        .danger {
            color: red !important;
        }
    </style>
</head>
<body>

    <h2>Live Character Counter</h2>

    <textarea id="message" maxlength="100"></textarea>

    <p id="counter">100 characters remaining</p>

    <button id="resetBtn">Reset</button>

    <script src="Q2.js"></script>

</body>
</html>
