
<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            gap: 10px;
        }

        .gallery img {
            width: 150px;
            height: 120px;
            object-fit: cover;
            cursor: pointer;
        }

        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        #modal img {
            max-width: 80%;
            max-height: 80%;
        }
    </style>
</head>
<body>

    <h2>Image Gallery</h2>

    <div class="gallery" id="gallery">

        <img src="https://picsum.photos/id/10/300/200">
        <img src="https://picsum.photos/id/20/300/200">
        <img src="https://picsum.photos/id/30/300/200">
        <img src="https://picsum.photos/id/40/300/200">
        <img src="https://picsum.photos/id/50/300/200">
        <img src="https://picsum.photos/id/60/300/200">

    </div>

    <div id="modal">
        <img id="modalImage">
    </div>

    <script src="Q5.js"></script>

</body>
</html>
