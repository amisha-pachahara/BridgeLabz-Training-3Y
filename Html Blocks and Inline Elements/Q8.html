
 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

    <h1>ABC Public School</h1>

    <h2>Student Report</h2>

    <!-- Student Marks Table -->
    <table border="1" title="Student Marks Report">

        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <th>Maximum Marks</th>
            <th>Obtained Marks</th>
        </tr>

        <tr>
            <td>English</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Science</td>
            <td>100</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Computer</td>
            <td>100</td>
            <td>92</td>
        </tr>

        <tr>
            <td>Social Science</td>
            <td>100</td>
            <td>80</td>
        </tr>

        <!-- Total -->
        <tr>
            <th colspan="2">Total</th>
            <td title="Total marks obtained">435 / 500</td>
        </tr>

        <!-- Percentage -->
        <tr>
            <th colspan="2">Percentage</th>
            <td title="Overall percentage">87%</td>
        </tr>

    </table>

</body>
</html>
</body>
</html>
