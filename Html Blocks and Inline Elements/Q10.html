<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>

    <h1>Travel Selection Page</h1>

    <!-- Country Dropdown -->
    <label for="country">Country:</label>

    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>Canada</option>
        <option>Australia</option>
    </select>

    <br><br>

    <!-- State Dropdown -->
    <label for="state">State:</label>

    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
        <option>Goa</option>
    </select>

    <br><br>

    <!-- City Dropdown -->
    <label for="city">City:</label>

    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
        <option>Mumbai</option>
    </select>

    <br><br>

    <!-- Tourist Place Dropdown -->
    <label for="place">Favorite Tourist Place:</label>

    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Eiffel Tower</option>
        <option>Goa Beach</option>
        <option>Red Fort</option>
    </select>

    <!-- Summary -->
    <p>
        My choices are India as the country, Uttar Pradesh as the state,
        Mathura as the city, and Taj Mahal as my favorite tourist place.
    </p>

</body>
</html>
