
<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Our Pricing Plans</h1>

    <div class="pricing">

        <div class="card">
            <h2>Basic</h2>
            <h3>₹499</h3>
            <p>5 Projects</p>
            <p>10 GB Storage</p>
            <p>Email Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="card middle">
            <h2>Premium</h2>
            <h3>₹999</h3>
            <p>15 Projects</p>
            <p>50 GB Storage</p>
            <p>Priority Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="card">
            <h2>Pro</h2>
            <h3>₹1499</h3>
            <p>Unlimited Projects</p>
            <p>100 GB Storage</p>
            <p>24/7 Support</p>
            <button>Choose Plan</button>
        </div>

    </div>

</body>
</html>
