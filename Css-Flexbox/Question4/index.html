
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <header>
            <h1>Dashboard</h1>
        </header>

        <aside>
            <h2>Menu</h2>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>

        <main>

            <div class="box">
                <h2>Total Users</h2>
                <p>1200</p>
            </div>

            <div class="box">
                <h2>Total Sales</h2>
                <p>₹50,000</p>
            </div>

            <div class="box">
                <h2>Orders</h2>
                <p>350</p>
            </div>

            <div class="box">
                <h2>Products</h2>
                <p>150</p>
            </div>

            <div class="box large">
                <h2>Monthly Report</h2>
                <p>Sales and performance information.</p>
            </div>

        </main>

    </div>

</body>
</html>
